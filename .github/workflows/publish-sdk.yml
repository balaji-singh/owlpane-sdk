name: Publish SDK
# Multi-language release on tag sdk-v* (or workflow_dispatch on that tag):
#   npm: @owlpane/node, @owlpane/browser
#   PyPI: owlpane
#   Go: module tag packages/go/v* (go get github.com/balaji-singh/owlpane-sdk/packages/go@<version>)
# Java / Ruby / .NET thin libraries are not published yet (env-only in schema/install-snippets.json).
#
# Secrets: NPM_TOKEN, PYPI_API_TOKEN (pypi.org — use project token for package "owlpane")
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, registry-url: "https://registry.npmjs.org", cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run codegen
      - run: git diff --exit-code packages/go/owlpane/zz_generated_env.go packages/python/owlpane/_generated_config.py schema/install-snippets.json
      - run: npm run build
      - run: npm test
      - name: Align release version with sdk-v* tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-versions.mjs
      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token for the @owlpane scope."
            exit 1
          fi
      - name: Require PYPI_API_TOKEN
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN is not set. Create a PyPI token for package owlpane and add it as a repo secret."
            exit 1
          fi
      - name: Publish @owlpane/node and @owlpane/browser to npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/node/package.json').version")"
          publish_ws() {
            local pkg="$1"
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already on npm; skipping"
            else
              npm publish -w "${pkg}" --provenance --access public
            fi
          }
          publish_ws @owlpane/node
          publish_ws @owlpane/browser
      - name: Publish owlpane to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          cd packages/python
          python -m build
          twine upload dist/* --non-interactive --skip-existing \
            -u __token__ -p "${PYPI_API_TOKEN}"
      - name: Push Go module semver tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/node/package.json').version")"
          GO_TAG="packages/go/v${VERSION}"
          if git rev-parse "${GO_TAG}" >/dev/null 2>&1; then
            echo "Go tag ${GO_TAG} already exists; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${GO_TAG}" -m "Go module release v${VERSION}"
          git push origin "${GO_TAG}"
      - name: Update GitHub release notes (install matrix)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/node/package.json').version")"
          TAG="sdk-v${VERSION}"
          BODY="$(cat <<EOF
          ## Install (v${VERSION})

          | Language | Install |
          |----------|---------|
          | Node | \`npm install @owlpane/node@${VERSION}\` |
          | Browser | \`npm install @owlpane/browser@${VERSION}\` |
          | Python | \`pip install owlpane==${VERSION}\` |
          | Go | \`go get github.com/balaji-singh/owlpane-sdk/packages/go@v${VERSION}\` |
          | Java / Ruby / .NET | Env + OTel agent only for now — see \`schema/install-snippets.json\` |

          CI runs codegen, build, and tests for Go/Python before any registry upload.
          EOF
          )"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${BODY}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "SDK v${VERSION}" --notes "${BODY}"
          fi
