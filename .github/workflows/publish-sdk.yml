name: Publish SDK
# Publishes @owlpane/node and @owlpane/browser to npm with provenance.
# Tag sdk-v0.1.0 matches packages/node and packages/browser version fields.
# Needs an NPM_TOKEN repository secret (automation token for the @owlpane scope).
on:
  push:
    tags: ["sdk-v*"]
permissions:
  contents: read
  packages: write
  id-token: write   # provenance attestation (npmjs.com)
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci
      - run: npm run build -w @owlpane/node -w @owlpane/browser
      - run: npm test -w @owlpane/node -w @owlpane/browser
      - name: Refuse to publish a version that does not match the tag
        run: |
          set -euo pipefail
          node_version="$(node -p "require('./packages/node/package.json').version")"
          browser_version="$(node -p "require('./packages/browser/package.json').version")"
          test "$node_version" = "$browser_version"
          test "sdk-v${node_version}" = "${GITHUB_REF_NAME}"
      - name: Publish SDKs (GitHub Packages or npmjs.com)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NPM_TOKEN}" ]; then
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
            npm publish -w @owlpane/node --provenance --access public
            npm publish -w @owlpane/browser --provenance --access public
          else
            {
              echo "@balaji-singh:registry=https://npm.pkg.github.com"
              echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
            } >> "${npmrc}"
            export NODE_AUTH_TOKEN="${GITHUB_TOKEN}"
            export NPM_CONFIG_REGISTRY=https://npm.pkg.github.com
            node scripts/publish-sdk-github.mjs
          fi
