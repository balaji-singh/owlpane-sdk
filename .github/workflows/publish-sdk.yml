name: Publish SDK
# Publishes ALL shipped languages on sdk-v*:
#   Node/Browser → GitHub Packages npm (@balaji-singh/owlpane-*)
#   Python → PyPI (PYPI_API_TOKEN) + wheel on GitHub Release
#   Go → git tag packages/go/v*
#   Java → GitHub Packages Maven (com.owlpane:owlpane-java)
#   Ruby → GitHub Packages RubyGems (owlpane)
#
# Secret GH_PACKAGES_TOKEN: classic PAT with write:packages + repo (required if GITHUB_TOKEN cannot publish).
# Optional: PYPI_API_TOKEN for pypi.org.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@balaji-singh"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: packages/go/go.sum
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: npm ci
      - run: npm run codegen
      - run: git diff --exit-code packages/go/owlpane/zz_generated_env.go packages/python/owlpane/_generated_config.py schema/install-snippets.json
      - run: npm run build
      - run: npm test
      - name: Align release version with sdk-v* tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-versions.mjs
      - name: Publish all languages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: bash scripts/publish-all-registries.sh
