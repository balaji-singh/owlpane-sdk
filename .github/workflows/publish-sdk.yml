name: Publish SDK
# Publishes @owlpane/node and @owlpane/browser to npm with provenance.
# Tag sdk-v0.1.0 matches packages/node and packages/browser version fields.
# Needs an NPM_TOKEN repository secret (automation token for the @owlpane scope).
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write   # provenance attestation (npmjs.com)
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20, registry-url: "https://registry.npmjs.org", cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run codegen
      - run: git diff --exit-code packages/go/owlpane/zz_generated_env.go packages/python/owlpane/_generated_config.py schema/install-snippets.json
      - run: npm run build
      - run: npm test
      - name: Refuse to publish a version that does not match the tag
        run: |
          set -euo pipefail
          node_version="$(node -p "require('./packages/node/package.json').version")"
          browser_version="$(node -p "require('./packages/browser/package.json').version")"
          test "$node_version" = "$browser_version"
          test "sdk-v${node_version}" = "${GITHUB_REF_NAME}"
      - name: Require NPM_TOKEN (npmjs.com publish)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository."
            echo "Add an npm automation token at Settings → Secrets → Actions → NPM_TOKEN,"
            echo "then re-run this workflow or push tag sdk-v<version> again."
            echo "GitHub Packages fallback was removed: GITHUB_TOKEN often lacks write_package (403)."
            exit 1
          fi
      - name: Publish @owlpane/node and @owlpane/browser to npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish -w @owlpane/node --provenance --access public
          npm publish -w @owlpane/browser --provenance --access public
