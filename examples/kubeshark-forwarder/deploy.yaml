apiVersion: v1
kind: Secret
metadata:
  name: owlpane-ingest
  namespace: kubeshark
stringData:
  key: "REPLACE_WITH_INGEST_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshark-owlpane-forwarder
  namespace: kubeshark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeshark-owlpane-forwarder
  template:
    metadata:
      labels:
        app: kubeshark-owlpane-forwarder
    spec:
      containers:
        - name: forwarder
          image: curlimages/curl:8.11.1
          env:
            - name: OWLPANE_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: owlpane-ingest
                  key: key
            - name: ENDPOINT
              value: "https://ingest.example.com/v1/logs"
            - name: CLUSTER
              value: "my-cluster"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              while true; do
                ts="$(date +%s)000000000"
                curl -sfS -X POST "$ENDPOINT" \
                  -H "Authorization: Bearer $OWLPANE_INGEST_KEY" \
                  -H "Content-Type: application/json" \
                  -d "{\"resourceLogs\":[{\"resource\":{\"attributes\":[
                    {\"key\":\"service.name\",\"value\":{\"stringValue\":\"owlpane-network\"}},
                    {\"key\":\"k8s.cluster.name\",\"value\":{\"stringValue\":\"$CLUSTER\"}}
                  ]},\"scopeLogs\":[{\"logRecords\":[
                    {\"timeUnixNano\":\"$ts\",\"body\":{\"stringValue\":\"flow\"},\"attributes\":[
                      {\"key\":\"owlpane.flow.src\",\"value\":{\"stringValue\":\"api\"}},
                      {\"key\":\"owlpane.flow.dst\",\"value\":{\"stringValue\":\"storefront\"}},
                      {\"key\":\"owlpane.flow.src_namespace\",\"value\":{\"stringValue\":\"default\"}},
                      {\"key\":\"owlpane.flow.dst_namespace\",\"value\":{\"stringValue\":\"default\"}},
                      {\"key\":\"owlpane.flow.protocol\",\"value\":{\"stringValue\":\"TCP\"}},
                      {\"key\":\"owlpane.flow.bytes\",\"value\":{\"intValue\":\"4096\"}},
                      {\"key\":\"owlpane.flow.verdict\",\"value\":{\"stringValue\":\"allowed\"}}
                    ]}
                  ]}]}]}]}"
                sleep 30
              done
