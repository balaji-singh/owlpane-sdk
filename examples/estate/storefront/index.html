<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CricketIQ storefront (example)</title>
<style>body{font:15px system-ui;background:#0f1218;color:#dfe6f2;max-width:640px;margin:40px auto;padding:0 16px}code{color:#f5b942}.row{padding:8px 0;border-bottom:1px solid #222a36}</style></head>
<body>
<h1>Storefront</h1>
<p>This page uses the Owlpane browser SDK. It browses matches and checks out on its own every few seconds, and now and then hits a JavaScript error.</p>
<div id="log"></div>
<script src="/config.js"></script>
<script type="module">
  import { init } from "/sdk/index.js";
  const owl = init({ projectKey: ESTATE.key, endpoint: ESTATE.endpoint, serviceName: "storefront", environment: "production", release: "5.0.1", propagateTraceTo: [ESTATE.bff] });
  const log = (t) => { const d = document.createElement("div"); d.className = "row"; d.textContent = new Date().toLocaleTimeString() + "  " + t; document.getElementById("log").prepend(d); };
  const user = "usr_" + Math.floor(Math.random() * 40);
  const api = (p, o = {}) => fetch(ESTATE.bff + p, { ...o, headers: { "x-user-id": user, ...(o.headers || {}) } });
  let n = 0;
  setInterval(async () => {
    n++;
    try {
      const id = 1 + Math.floor(Math.random() * 60);
      if (n % 4 === 0) { const r = await api("/api/checkout", { method: "POST" }); log("checkout -> " + r.status); }
      else if (n % 2 === 0) { const r = await api("/api/matches/" + id); log("match " + id + " -> " + r.status); }
      else { const r = await api("/api/matches"); log("matches -> " + r.status); }
      if (n % 9 === 0) setTimeout(() => { null.crash(); }, 10); // an uncaught error the SDK reports
    } catch (e) { log("request failed: " + e.message); }
  }, 2500);
  window.addEventListener("pagehide", () => owl.flush());
</script>
</body></html>
